<body>
<script type="module">
/* ──────────────────────────────────────────────────────────────
   恋人（李荣浩）· 星露谷风格 MV —— 单文件预览
   320×180 原生像素 → 6 倍放大到 1920×1080，24 fps
   角色行走图取自游戏本体（.xnb 解包），base64 内嵌在本文件里
   ?frame=sample|farm|stop|room|cast  可切换画面
   ────────────────────────────────────────────────────────────── */
// 星露谷风格像素画：320×180 原生，6 倍最近邻放大到 1920×1080
// 调色板 ≤ 30 色；所有形状都对齐到像素格；渐变靠抖动，不靠插值。

const W = 320, H = 180, SCALE = 6;

const P = {
  ink: '#141019',
  black: '#221a26',
  sky0: '#171a33', sky1: '#232a4d', sky2: '#3a4472', sky3: '#5c5f96',
  dawn0: '#8c6a9a', dawn1: '#c98a86', dawn2: '#e8a884', dawn3: '#f7c69a',
  sun: '#ffe0a8',
  hillFar: '#2b3457', hillNear: '#37456b', hillLit: '#4b5c86',
  grassDark: '#2c5238', grass: '#3d7345', grassLit: '#5c9550', grassHi: '#83b85c',
  path: '#b98a5e', pathDark: '#96684250', pathLit: '#cfa273',
  wood: '#8a5738', woodDark: '#5f3a26', woodLit: '#b97d4a',
  waterDark: '#20405e', water: '#2e6480', waterLit: '#4b92a6', foam: '#9fd0d8',
  white: '#fff6e4', cream: '#f2e0bc',
  lamp: '#ffd074', lampLit: '#ff9a3c',
  hair: '#2a2230', hairHi: '#4a3f52',
  skin: '#f2cbab', skinDark: '#cf9f82', skinLit: '#ffe3c8',
  shirt: '#c9493f', shirtDark: '#8f2f30', overall: '#3e6ea8', overallDark: '#2b4d7a', overallLit: '#5b8cc4',
  boot: '#5d3f2a', bootLit: '#8a6242',
  herHair: '#7a4630', herHairHi: '#a4654a', dress: '#f0d9b8', dressDark: '#c9ac86', herShoe: '#d0433c',
  ink2: '#2e2436',
};

// —— 画布：先画在 320×180 的缓冲上，再整数放大 ——
function canvas() {
  const buf = document.createElement('canvas'); buf.width = W; buf.height = H;
  const g = buf.getContext('2d'); g.imageSmoothingEnabled = false;
  const out = document.createElement('canvas'); out.width = W * SCALE; out.height = H * SCALE;
  const o = out.getContext('2d'); o.imageSmoothingEnabled = false;
  return { buf, g, out, o };
}
function present(c, bg = P.sky0, cam = null) {
  c.o.fillStyle = bg; c.o.fillRect(0, 0, c.out.width, c.out.height);
  if (!cam) { c.o.drawImage(c.buf, 0, 0, W * SCALE, H * SCALE); return c.out; }
  const z = cam.z ?? 1, ox = cam.ox ?? 0, oy = cam.oy ?? 0;
  c.o.drawImage(c.buf, ox, oy, c.out.width * z, c.out.height * z);
  return c.out;
}

// —— 基本形状：一切都是整数格 ——
const rect = (g, x, y, w, h, col) => { g.fillStyle = col; g.fillRect(x | 0, y | 0, w | 0, h | 0); };
const px = (g, x, y, col) => rect(g, x, y, 1, 1, col);
const hline = (g, x0, x1, y, col) => rect(g, x0, y, x1 - x0 + 1, 1, col);
const vline = (g, x, y0, y1, col) => rect(g, x, y0, 1, y1 - y0 + 1, col);

// 4×4 Bayer
const BAYER = [[0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]];
function dither(g, x, y, w, h, a, b, level = 8) {
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
    const t = BAYER[(y + j) & 3][(x + i) & 3];
    px(g, x + i, y + j, t < level ? a : b);
  }
}
// 竖向渐变（两条色之间用抖动过渡）
function vgrad(g, x, y, w, h, stops) {
  const n = stops.length - 1;
  for (let j = 0; j < h; j++) {
    const t = (j / Math.max(1, h - 1)) * n;
    const i = Math.min(n - 1, Math.floor(t)), f = t - i;
    const lvl = Math.round(f * 16);
    if (lvl <= 0) hline(g, x, x + w - 1, y + j, stops[i]);
    else if (lvl >= 16) hline(g, x, x + w - 1, y + j, stops[i + 1]);
    else dither(g, x, y + j, w, 1, stops[i], stops[i + 1], lvl);
  }
}

// —— 像素中文：小字号渲染后按阈值二值化，得到硬边 ——
let _f = null;
function text(g, str, x, y, col, size = 12, align = 'left') {
  if (!_f) { _f = document.createElement('canvas'); _f.width = 960; _f.height = 40; }
  const f = _f.getContext('2d');
  f.clearRect(0, 0, _f.width, _f.height);
  f.font = `${size}px "Microsoft YaHei", "SimHei", sans-serif`;
  f.textBaseline = 'top'; f.fillStyle = '#000'; f.textAlign = 'left';
  const w = Math.ceil(f.measureText(str).width);
  f.fillText(str, 0, 0);
  const img = f.getImageData(0, 0, w + 2, size + 6);
  const d = img.data;
  const ox = align === 'center' ? Math.round(x - w / 2) : align === 'right' ? Math.round(x - w) : Math.round(x);
  g.fillStyle = col;
  for (let j = 0; j < img.height; j++) for (let i = 0; i < img.width; i++) {
    if (d[(j * img.width + i) * 4 + 3] > 110) g.fillRect(ox + i, y + j, 1, 1);
  }
  return w;
}


﻿// 场景：农舍黄昏、巴士站、雨中空屋 —— 星露谷风格的 3/4 俯视

// —— 天空 ——
function sky(g, mode = 'dusk') {
  if (mode === 'dusk') {
    vgrad(g, 0, 0, W, 96, [P.sky0, P.sky1, P.sky2, P.dawn0, P.dawn1, P.dawn2, P.dawn3]);
    // 云：一条一条的扁像素
    const cl = [[18, 34, 46, 3], [52, 52, 30, 2], [120, 26, 58, 3], [196, 40, 40, 2], [250, 30, 54, 3], [96, 60, 34, 2]];
    for (const [x, y, w, h] of cl) { hline(g, x, x + w - 1, y, P.dawn3); hline(g, x + 4, x + w - 5, y + 1, P.dawn2); if (h > 2) hline(g, x + 9, x + w - 9, y + 2, P.dawn1); }
    // 太阳低垂
    rect(g, 246, 62, 10, 10, P.sun); rect(g, 248, 60, 6, 2, P.sun); rect(g, 248, 74, 6, 2, P.sun);
  } else if (mode === 'night') {
    vgrad(g, 0, 0, W, 96, [P.black, P.sky0, P.sky1, P.sky2, P.sky3]);
  } else {
    vgrad(g, 0, 0, W, 96, [P.sky3, P.sky2, P.dawn0, P.dawn1]);
  }
  // 星
  if (mode === 'night') for (const [x, y] of [[30, 14], [74, 8], [126, 20], [180, 6], [232, 18], [288, 12], [52, 30], [210, 34]]) px(g, x, y, P.cream);
}

// —— 远山 ——
function hills(g, y = 84) {
  const pts = [[0, y + 14], [24, y + 4], [52, y + 12], [86, y - 2], [118, y + 8], [150, y + 2], [186, y + 12], [216, y + 6], [250, y + 14], [284, y + 4], [320, y + 12]];
  for (let i = 0; i < pts.length - 1; i++) {
    const [x0, y0] = pts[i], [x1, y1] = pts[i + 1];
    for (let x = x0; x < x1; x++) {
      const t = (x - x0) / (x1 - x0), yy = Math.round(y0 + (y1 - y0) * t);
      rect(g, x, yy, 1, y + 22 - yy, P.hillFar);
      px(g, x, yy, P.hillNear);
    }
  }
  // 近一层
  for (let x = 0; x < W; x++) {
    const yy = 104 + Math.round(5 * Math.sin(x / 26) + 3 * Math.sin(x / 9 + 1));
    rect(g, x, yy, 1, 132 - yy, P.hillNear);
    px(g, x, yy, P.hillLit);
  }
}

// —— 草地：一层一层的亮带，星露谷那种 ——
function ground(g, y0 = 128, y1 = H, base = P.grass) {
  rect(g, 0, y0, W, y1 - y0, base);
  hline(g, 0, W - 1, y0, P.grassLit);
  // 草簇
  for (let i = 0; i < 150; i++) {
    const x = (i * 47 + 13) % W, y = y0 + 4 + ((i * 73) % (y1 - y0 - 6));
    px(g, x, y, P.grassDark); px(g, x + 1, y - 1, P.grassDark); px(g, x + 2, y, P.grassDark);
  }
  for (let i = 0; i < 60; i++) {
    const x = (i * 83 + 29) % W, y = y0 + 6 + ((i * 41) % (y1 - y0 - 8));
    px(g, x, y, P.grassHi); px(g, x, y - 1, P.grassHi);
  }
  // 小花
  for (let i = 0; i < 22; i++) {
    const x = (i * 137 + 61) % W, y = y0 + 10 + ((i * 59) % (y1 - y0 - 12));
    px(g, x, y, i % 3 ? '#f2c94c' : '#f08fa8'); px(g, x + 1, y, P.cream);
  }
}

// —— 房子 ——
function house(g, x, y, w = 92, h = 54, lit = true) {
  // 墙
  rect(g, x, y, w, h, P.cream);
  for (let yy = y; yy < y + h; yy += 5) hline(g, x, x + w - 1, yy, P.dress);
  // 屋顶
  for (let i = 0; i < 18; i++) {
    const ww = w + 10 - i * 2;
    rect(g, x - 5 + i, y - i, ww, 1, i % 3 === 0 ? P.woodDark : P.wood);
  }
  rect(g, x - 6, y + 17, w + 12, 3, P.woodDark);
  // 门
  const dx = x + w / 2 - 7;
  rect(g, dx, y + h - 24, 14, 24, P.woodDark);
  rect(g, dx + 1, y + h - 23, 12, 22, P.wood);
  vline(g, dx + 6, y + h - 23, y + h - 2, P.woodDark);
  px(g, dx + 11, y + h - 12, P.cream);
  // 窗
  for (const wx of [x + 10, x + w - 22]) {
    rect(g, wx, y + 8, 12, 10, P.woodDark);
    rect(g, wx + 1, y + 9, 10, 8, lit ? P.lamp : P.waterDark);
    if (lit) { rect(g, wx + 2, y + 10, 8, 6, P.lampLit); rect(g, wx + 3, y + 11, 4, 3, P.lamp); }
    vline(g, wx + 6, y + 9, y + 16, P.woodDark);
  }
}

// —— 栅栏 ——
function fence(g, x0, x1, y) {
  vline(g, x0, y - 8, y + 3, P.woodLit); vline(g, x1, y - 8, y + 3, P.woodLit);
  hline(g, x0, x1, y - 5, P.woodLit); hline(g, x0, x1, y - 1, P.woodLit);
  for (let x = x0; x <= x1; x += 14) vline(g, x, y - 8, y + 3, P.woodLit);
}

// —— 巴士站：一根牌子 ＋ 一条木头长椅 ——
function busstop(g, x, y) {
  fg:
  { vline(g, x, y - 30, y + 2, P.woodDark); }
  rect(g, x - 13, y - 30, 26, 14, P.cream);
  rect(g, x - 12, y - 29, 24, 12, P.wood);
  rect(g, x - 9, y - 26, 18, 6, P.cream);
  // 牌子上画一辆小巴
  rect(g, x - 7, y - 25, 14, 4, '#3e6ea8');
  rect(g, x - 6, y - 24, 4, 2, P.cream); rect(g, x + 1, y - 24, 4, 2, P.cream);
  px(g, x - 5, y - 21, P.ink2); px(g, x + 4, y - 21, P.ink2);
  // 长椅
  const bx = x + 28;
  rect(g, bx, y - 10, 34, 4, P.woodLit);
  rect(g, bx, y - 6, 34, 2, P.woodDark);
  vline(g, bx + 2, y - 6, y + 2, P.woodDark); vline(g, bx + 31, y - 6, y + 2, P.woodDark);
}

// —— 树（星露谷那种圆冠）——
function tree(g, x, y, s = 1) {
  rect(g, x - 2, y - 8, 5, 12, P.woodDark);
  const r = 13 * s;
  for (let j = -2; j <= 2; j++) {
    const ww = Math.round(r * (1 - Math.abs(j) * .28));
    rect(g, x - ww / 2, y - 8 + j * 4 + 2, ww, 4, j === -2 ? P.grassHi : P.grassLit);
  }
  for (let j = -2; j <= 2; j++) {
    const ww = Math.round(r * (1 - Math.abs(j) * .28));
    hline(g, x - ww / 2, x + ww / 2, y - 6 + j * 4, P.grassHi);
  }
}

// —— 雨：斜线 ＋ 地面水花 ——
function rain(g, t, n = 90) {
  for (let i = 0; i < n; i++) {
    const x = (i * 37 + Math.round(t * 60)) % (W + 40) - 20;
    const y = (i * 53 + Math.round(t * 190)) % (H + 30) - 10;
    vline(g, x, y, y + 4, '#8fa8c4');
    px(g, x - 1, y + 3, '#6a84a4');
  }
}

// —— 对话框（星露谷的木框）——
function box(g, x, y, w, h) {
  rect(g, x, y, w, h, P.ink2);
  rect(g, x + 1, y + 1, w - 2, h - 2, '#3b2f46');
  rect(g, x + 2, y + 2, w - 4, 1, '#5a4a68');
  rect(g, x, y, w, 1, P.woodDark); rect(g, x, y + h - 1, w, 1, P.woodDark);
  rect(g, x, y, 1, h, P.woodDark); rect(g, x + w - 1, y, 1, h, P.woodDark);
  for (const [cx, cy] of [[x + 2, y + 2], [x + w - 4, y + 2], [x + 2, y + h - 4], [x + w - 4, y + h - 4]]) px(g, cx, cy, P.woodLit);
}

const DIR = { down: 0, right: 1, up: 2, left: 3 };
const CACHE = {};

async function loadSprites() {
  await Promise.all(Object.keys(SHEETS).map(k => new Promise((res, rej) => {
    const im = new Image();
    im.onload = () => { CACHE[k] = im; res(); };
    im.onerror = rej;
    im.src = SHEETS[k];
  })));
}

// row: 直接指定行；dir: 'down' | 'right' | 'up' | 'left'
function actor(g, who, x, y, o = {}) {
  const im = CACHE[who];
  if (!im) return;
  const row = o.row != null ? o.row : DIR[o.dir || 'down'];
  const frame = ((o.frame | 0) % 4 + 4) % 4;
  const k = o.k || 1;
  g.imageSmoothingEnabled = false;
  g.drawImage(im, frame * 16, row * 32, 16, 32, Math.round(x), Math.round(y), 16 * k, 32 * k);
}

const ROW = { sit: 6 };

﻿// 星露谷风格 · 试片：?frame=farm|stop|room|cast&raw=1



const qs = new URLSearchParams(location.search);
const FRAME = qs.get('frame') || 'sample';
const c = canvas();
const g = c.g;

// —— 像素对话框：画在放大后的画面上（屏幕空间），不受镜头推拉影响 ——
function panel(x, y, w, h) {
  const o = c.o, k = SCALE;
  const R = (a, b, cw, ch, col) => { o.fillStyle = col; o.fillRect(Math.round(a * k), Math.round(b * k), Math.round(cw * k), Math.round(ch * k)); };
  const ink = '#1a1020', cream = '#e8d3a8', fill = '#33243c';
  R(x + 2, y + 2, w, h, 'rgba(0,0,0,.34)');
  R(x + 2, y, w - 4, h, ink);
  R(x, y + 2, w, h - 4, ink);
  R(x + 1, y + 1, 1, 1, ink); R(x + w - 2, y + 1, 1, 1, ink);
  R(x + 1, y + h - 2, 1, 1, ink); R(x + w - 2, y + h - 2, 1, 1, ink);
  R(x + 4, y + 1, w - 8, 1, cream); R(x + 4, y + h - 2, w - 8, 1, cream);
  R(x + 1, y + 4, 1, h - 8, cream); R(x + w - 2, y + 4, 1, h - 8, cream);
  R(x + 2, y + 2, 1, 1, cream); R(x + w - 3, y + 2, 1, 1, cream);
  R(x + 2, y + h - 3, 1, 1, cream); R(x + w - 3, y + h - 3, 1, 1, cream);
  R(x + 3, y + 3, 1, 1, '#6b5674'); R(x + w - 4, y + 3, 1, 1, '#6b5674');
  R(x + 5, y + 3, w - 10, h - 6, fill);
}

// 字幕：字宽正好 6 的倍数对齐世界格，硬投影（没有模糊），字距 1 格
function lyric(str, y = 160, x = 40, size = 42) {
  const o = c.o;
  o.save();
  o.font = `700 ${size}px "Microsoft YaHei", "SimHei", sans-serif`;
  o.textBaseline = 'middle'; o.textAlign = 'left';
  o.letterSpacing = `${SCALE}px`;
  o.fillStyle = '#160f1c';
  o.fillText(str, x * SCALE + SCALE, y * SCALE + SCALE);
  o.fillStyle = '#fff6e4';
  o.fillText(str, x * SCALE, y * SCALE);
  o.restore();
}

function farmFrame(t) {
  sky(g, 'dusk');
  hills(g, 86);
  ground(g, 124);
  for (let i = 0; i < 46; i++) {
    const y = 126 + i, x = 168 + i * 2;
    rect(g, x, y, 26, 1, P.path);
    px(g, x - 1, y, P.pathDark);
    if (i % 7 === 0) hline(g, x + 3, x + 20, y, P.pathLit);
  }
  house(g, 26, 82, 92, 54, true);
  fence(g, 210, 268, 138);
  tree(g, 292, 128, 1.1);
  tree(g, 276, 150, .8);
  busstop(g, 250, 152);
  actor(g, 'sebastian', 100, 118, { dir: 'down' });
  rect(g, 94, 136, 20, 1, P.grassDark);
  
}

function stopFrame(t) {
  sky(g, 'dusk');

  for (const [x, w, h] of [[8, 28, 20], [42, 22, 15], [72, 34, 24], [112, 20, 13]]) {

    for (let i = 0; i < 9; i++) rect(g, x - 4 + i, 130 - h - i, w + 8 - i * 2, 1, i % 3 ? P.wood : P.woodDark);
    for (let wx = x + 4; wx < x + w - 4; wx += 9) rect(g, wx, 130 - h + 6, 4, 5, P.lampLit);
  }
  rect(g, 0, 146, W, 22, P.pathDark);
  rect(g, 0, 148, W, 18, P.path);
  for (let x = 6; x < W; x += 30) hline(g, x, x + 14, 156, P.cream);
  busstop(g, 142, 148);
  tree(g, 30, 148, 1.15);
  tree(g, 250, 146, 1.25);
  actor(g, 'sebastian', 104, 118, { dir: 'down' });
  actor(g, 'penny', 186, 118, { dir: 'down' });
  
}

// —— 5 秒样片：公交站，镜头缓推，末班车进站 ——
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

function bus(g, x, yb, door) {
  const b = '#3f5480', bd = '#26314e', win = '#f4dfae', wheel = '#1b1522';
  rect(g, x, yb - 40, 104, 40, b);
  rect(g, x, yb - 40, 104, 4, '#5a71a4');
  rect(g, x, yb - 9, 104, 9, bd);
  // 车头朝左：驾驶窗、车门、车灯都在左边
  for (let i = 0; i < 4; i++) rect(g, x + 22 + i * 21, yb - 34, 16, 14, win);
  rect(g, x + 3, yb - 34, 13, 14, win);
  rect(g, x + 3, yb - 34, 13, 7, '#cfe0f0');
  rect(g, x + 17, yb - 6, 16, 8, wheel); rect(g, x + 71, yb - 6, 16, 8, wheel);
  rect(g, x + 21, yb - 4, 8, 4, '#5c5c6c'); rect(g, x + 75, yb - 4, 8, 4, '#5c5c6c');
  rect(g, x + 1, yb - 22, 3, 6, '#ffe9a8');
  rect(g, x + 4, yb - 46, 34, 6, P.cream);
  rect(g, x + 6, yb - 45, 30, 4, '#2b3550');
  if (door) { rect(g, x + 18, yb - 34, 10, 26, '#10151f'); rect(g, x + 22, yb - 32, 1, 22, '#3f5480'); }
  // 车头：倒角 + 前脸暗边 + 保险杠，读得出是车头
  rect(g, x, yb - 40, 3, 5, bd);
  rect(g, x + 3, yb - 40, 2, 4, bd);
  rect(g, x, yb - 35, 2, 25, bd);
  rect(g, x, yb - 10, 5, 10, '#161c2c');
  rect(g, x + 5, yb - 8, 6, 3, '#2b3550');
  rect(g, x, yb - 40, 104, 2, '#5a71a4');
}

function sampleFrame(t) {
  sky(g, 'dusk');
  hills(g, 84);
  ground(g, 126);
  for (const [x, w, h] of [[8, 28, 20], [42, 22, 15], [72, 34, 24], [112, 20, 13]]) {
    rect(g, x, 130 - h, w, h, P.cream);
    for (let i = 0; i < 9; i++) rect(g, x - 4 + i, 130 - h - i, w + 8 - i * 2, 1, i % 3 ? P.wood : P.woodDark);
    for (let wx = x + 4; wx < x + w - 4; wx += 9) rect(g, wx, 130 - h + 6, 4, 5, P.lampLit);
  }
  // 草在风里晃
  for (let i = 0; i < 34; i++) {
    const x = 6 + i * 9, y = 172 + (i % 4);
    const s = Math.round(Math.sin(t * 2.2 + i * 0.7) * 1.4);
    px(g, x + s, y, P.grassHi);
    px(g, x + s + 1, y + 1, P.grassLit);
  }
  rect(g, 0, 146, W, 22, P.pathDark);
  rect(g, 0, 148, W, 18, P.path);
  for (let x = 6; x < W; x += 30) hline(g, x, x + 14, 156, P.cream);
  // 车进站：3.0 s 起，1.1 s 内减速停稳
  const p = clamp((t - 2.9) / 1.15, 0, 1);
  const ease = 1 - Math.pow(1 - p, 3);
  busstop(g, 120, 148);
  tree(g, 30, 148, 1.15);
  tree(g, 302, 146, 1.25);
  actor(g, 'penny', 150, 118, { dir: 'down' });
  const walkP = Math.min(1, t / 1.4);
  const wx = Math.round(58 + 38 * (1 - Math.pow(1 - walkP, 2)));
  const bob = walkP < 1 && Math.floor(t * 7) % 2 ? 1 : 0;
  actor(g, 'sebastian', wx, 118 - bob, { dir: walkP < 1 ? 'right' : 'down', frame: Math.floor(t * 8) });
  // 车最后画：它在最近的马路上，要压住长椅、树、人
  if (t > 2.85) bus(g, 340 - (340 - 200) * ease, 168, t > 4.25);
}

function roomFrame(t) {
  rect(g, 0, 0, W, 98, '#2b2233');
  for (let y = 0; y < 98; y += 11) hline(g, 0, W - 1, y, '#332838');
  rect(g, 0, 98, W, H - 98, '#4a3630');
  for (let y = 98; y < H; y += 12) {
    hline(g, 0, W - 1, y, '#3a2a26');
    for (let x = ((y * 3) % 24); x < W; x += 24) vline(g, x, y + 1, y + 10, '#573f37');
  }
  rect(g, 34, 24, 86, 62, P.woodDark);
  rect(g, 37, 27, 80, 56, '#16233a');
  for (let i = 0; i < 26; i++) {
    const x = 38 + ((i * 37) % 78);
    const y = 28 + (((i * 53) + Math.floor(t * 40 + i * 7)) % 54);
    px(g, x, y, '#4f74a8'); px(g, x, y + 1, '#3a5784');
  }
  vline(g, 77, 27, 82, P.woodDark); hline(g, 37, 116, 55, P.woodDark);
  rect(g, 28, 84, 98, 5, P.wood);
  rect(g, 150, 6, 22, 4, P.woodDark);
  rect(g, 152, 10, 18, 7, P.lampLit);
  rect(g, 154, 11, 14, 4, '#ffe9a8');
  for (let r = 0; r < 22; r += 2) {
    for (let a = 0; a < r * 4; a++) {
      const th = a / (r * 4) * 6.2832;
      const x = Math.round(161 + Math.cos(th) * (r + 4)), y = Math.round(20 + Math.sin(th) * (r * .8 + 4));
      if (y > 17 && y < 96 && x > 0 && x < W) px(g, x, y, r % 4 ? '#6d5238' : '#7d5f40');
    }
  }
  rect(g, 108, 100, 100, 26, P.wood);
  rect(g, 108, 100, 100, 3, P.woodLit);
  vline(g, 158, 100, 126, P.woodDark);
  rect(g, 124, 86, 44, 15, '#2e2a34');
  rect(g, 126, 88, 40, 11, '#191620');
  rect(g, 132, 90, 10, 4, '#4a4334'); rect(g, 150, 90, 10, 4, '#4a4334');
  px(g, 145, 96, P.lampLit); px(g, 146, 96, P.lampLit);
  rect(g, 180, 90, 18, 11, '#3b3440');
  rect(g, 182, 92, 14, 6, P.cream);
  rect(g, 184, 93, 10, 1, '#c8403c');
  actor(g, 'sebastian', 236, 96, { dir: 'down' });
  rect(g, 234, 128, 20, 1, '#33281f');
  
}

// 人物卡：两个人 3 倍并排，右下角放 1× 参照，看片里实际多大
function castFrame(t) {
  rect(g, 0, 0, W, H, '#1a1a26');
  for (let x = 0; x < W; x += 8) vline(g, x, 0, H, '#20202e');
  for (let y = 0; y < H; y += 8) hline(g, 0, W, y, '#20202e');
  const rows = [['sebastian', 30], ['penny', 86]];
  for (const [who, y] of rows) {
    rect(g, 32, y - 4, 92, 40, '#242434');
    rect(g, 130, y - 4, 92, 40, '#242434');
    for (let f = 0; f < 4; f++) actor(g, who, 38 + f * 21, y, { dir: 'down', frame: f });
    for (let f = 0; f < 4; f++) actor(g, who, 136 + f * 21, y, { dir: 'right', frame: f });
  }
  rect(g, 0, 134, W, 46, '#141420');
}
function draw(t) {
  g.clearRect(0, 0, W, H);
  if (FRAME === 'stop') stopFrame(t);
  else if (FRAME === 'room') roomFrame(t);
  else if (FRAME === 'cast') castFrame(t);
  else if (FRAME === 'sample') sampleFrame(t);
  else farmFrame(t);
  let cam = null;
  if (FRAME === 'sample') {
    const z = 1 + 0.10 * clamp(t / 5, 0, 1);
    const fx = 140 * SCALE, fy = 96 * SCALE;
    cam = { z, ox: -(z - 1) * fx, oy: -(z - 1) * fy };
  }
  document.body.replaceChildren(present(c, P.sky0, cam));
  if (FRAME === 'stop' || FRAME === 'sample') {
    panel(14, 14, 292, 28);
    lyric('她说，八月底的车，只停三分钟。', 29, 44, 46);
  } else if (FRAME === 'room') {
    panel(14, 150, 292, 28);
    lyric('我按下 PLAY，磁带卡住了。', 165, 44, 46);
  } else if (FRAME === 'farm') {
    panel(14, 150, 292, 28);
    lyric('那年夏天，我把磁带留在了录音机里。', 165, 44, 46);
  } else if (FRAME === 'cast') {
    lyric('塞巴斯蒂安', 18, 36, 30);
    lyric('潘妮', 18, 168, 30);
    lyric('下 / 右，各四帧——走路是这么动起来的', 148, 36, 26);
  }
}
await loadSprites();
window.render = draw;
window.DUR = FRAME === 'sample' ? 5 : 8;
draw(0);
window.READY = true;


// —— 播放循环：24 fps，5 秒一循环 ——
const t0 = performance.now();
const STEP = 1000 / 24;
let last = -1;
function tick() {
  const ms = performance.now() - t0;
  const f = Math.floor(ms / STEP);
  if (f !== last) {
    last = f;
    draw((ms / 1000) % (window.DUR || 5));
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
